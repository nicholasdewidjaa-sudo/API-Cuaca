<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cuacaku - Informasi Cuaca</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="app-container">
            <!-- Header -->
            <header class="app-header">
                <div class="logo-area">
                    <span class="logo-icon">🌤️</span>
                    <h1>CuacaGuah</h1>
                </div>
                <p>Informasi cuaca di seluruh dunia</p>
            </header>

            <!-- Kotak Pencarian dengan Dropdown Saran -->
            <div class="search-box">
                <div class="search-wrapper">
                    <input
                        type="text"
                        id="city-input"
                        placeholder="Ketik nama kota (cth: Medan, Bandung)..."
                        autocomplete="off"
                    />
                    <!-- Kotak Opsi Wilayah Mendekati -->
                    <div
                        id="suggestions-box"
                        class="suggestions-box hidden"
                    ></div>
                </div>
                <button id="search-btn">Cari</button>
            </div>

            <!-- Status / Pesan Error -->
            <div id="status-message" class="status-message"></div>

            <!-- Konten Utama Cuaca (Disembunyikan sebelum pencarian) -->
            <div id="weather-content" class="weather-content hidden">
                <!-- Kartu Utama Suhu -->
                <div class="main-weather-card">
                    <div class="location-header">
                        <h2 id="city-name">-</h2>
                        <span id="update-time">-</span>
                    </div>

                    <div class="weather-body">
                        <div class="temp-display">
                            <div>
                                <span id="temperature">--</span
                                ><span class="degree">°C</span>
                            </div>
                            <p id="weather-condition" class="condition-text">
                                -
                            </p>
                            <span id="apparent-temp" class="feels-like">-</span>
                        </div>
                        <div class="weather-illustration">
                            <span id="weather-emoji" class="emoji-icon"
                                >☁️</span
                            >
                        </div>
                    </div>
                </div>

                <!-- Kartu Informasi Detail (Kelembapan, Angin, Peluang Hujan) -->
                <div class="details-grid">
                    <div class="detail-card">
                        <div class="detail-icon">💧</div>
                        <div class="detail-info">
                            <span class="detail-label">Kelembapan</span>
                            <strong id="humidity">--%</strong>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">🌬️</div>
                        <div class="detail-info">
                            <span class="detail-label">Kecepatan Angin</span>
                            <strong id="wind-speed">-- km/j</strong>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">🌧️</div>
                        <div class="detail-info">
                            <span class="detail-label">Peluang Hujan</span>
                            <strong id="rain-chance">--%</strong>
                        </div>
                    </div>
                </div>

                <!-- Prakiraan Per Jam -->
                <div class="hourly-section">
                    <h3>Prakiraan Per Jam</h3>
                    <div id="hourly-list" class="hourly-list"></div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
